name: Release

# A tag is the only way to publish. Nothing here runs on a branch push, so an
# accidental commit cannot cut a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write        # create the release and commit releases.json

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # A tag must not be able to publish a red tree. The release runs the same
      # complete Python discovery gate as CI so a newly added test is included
      # automatically.
      - name: Check
        run: |
          python -m compileall -q rosetta tests
          python -m unittest discover -s tests
          npm test
          node scripts/build.mjs

      - name: Tag must match rosetta.__version__
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python -c 'import rosetta; print(rosetta.__version__)')"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match rosetta.__version__ ($version)"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build the tarball
        run: |
          mkdir -p artifacts
          bash scripts/make-tarball.sh artifacts
          ls -la artifacts

      # Prove the published bytes install and run before anyone else gets them.
      - name: Install from the artifact and run the demo offline
        run: |
          ROSETTA_BASE_URL="file://$PWD/artifacts" \
          ROSETTA_HOME="$RUNNER_TEMP/share" \
          ROSETTA_BIN_DIR="$RUNNER_TEMP/bin" \
            sh public/install.sh --version "$VERSION"
          "$RUNNER_TEMP/bin/rosetta" --version
          "$RUNNER_TEMP/bin/rosetta" demo

      - name: Pin the release into install.sh and refresh releases.json
        run: |
          sha="$(cut -d' ' -f1 artifacts/SHA256SUMS)"
          tarball="rosetta-$VERSION.tar.gz"
          repo="https://github.com/${GITHUB_REPOSITORY}"

          # The published installer defaults to this release. The sentinel stays in
          # git so a checkout never claims a release it cannot serve.
          sed -i "s|^PINNED_VERSION=\".*\"|PINNED_VERSION=\"$VERSION\"|" public/install.sh
          sh -n public/install.sh

          python - "$VERSION" "$sha" "$tarball" "$repo" <<'PY'
          import json, subprocess, sys
          from datetime import datetime, timezone
          from pathlib import Path

          version, sha, tarball, repo = sys.argv[1:5]
          size = subprocess.run(
              ["du", "-h", f"artifacts/{tarball}"], capture_output=True, text=True
          ).stdout.split()[0]
          entry = {
              "version": version,
              "tag": f"v{version}",
              "published": datetime.now(timezone.utc).date().isoformat(),
              "tarball": tarball,
              "tarball_url": f"{repo}/releases/download/v{version}/{tarball}",
              "checksums_url": f"{repo}/releases/download/v{version}/SHA256SUMS",
              "sha256": sha,
              "size": size,
          }
          path = Path("public/releases.json")
          manifest = json.loads(path.read_text())
          manifest.pop("_comment", None)
          manifest["_comment"] = (
              "Written by .github/workflows/release.yml. Never hand-edit: a stale "
              "version or checksum on the download page is worse than none."
          )
          manifest["latest"] = entry
          manifest["releases"] = [
              entry, *[r for r in manifest.get("releases", []) if r.get("version") != version]
          ]
          path.write_text(json.dumps(manifest, indent=2) + "\n")
          print(json.dumps(entry, indent=2))
          PY

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            artifacts/"rosetta-$VERSION.tar.gz" \
            artifacts/SHA256SUMS \
            --title "Rosetta $VERSION" \
            --generate-notes

      - name: Commit the pinned installer and manifest
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/install.sh public/releases.json
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Publish Rosetta $VERSION download metadata"
            git push origin HEAD:main
          fi
