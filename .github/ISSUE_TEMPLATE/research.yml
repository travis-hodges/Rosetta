name: Research agent task
description: Assign investigation, architecture, or evidence gathering to a local Codex agent.
title: "[Research] "
labels:
  - "agent:ready"
  - "agent:researcher"
body:
  - type: markdown
    attributes:
      value: |
        **Rosetta** is a verification system for AI modification of legacy code in languages almost nobody can read (MUMPS, COBOL, JOVIAL, CMS-2). It is *not* the GitHub-issue orchestration service in `orchestration/`, which is temporary build infrastructure. Read [docs/PROJECT.md](https://github.com/travis-hodges/Rosetta/blob/main/docs/PROJECT.md) before scoping work.
  - type: textarea
    id: question
    attributes:
      label: Research question
      description: State the decision or uncertainty the agent must resolve.
    validations:
      required: true
  - type: textarea
    id: deliverable
    attributes:
      label: Required deliverable
      description: Describe the expected artifact, recommendation, or evidence standard.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Sources and context
      description: Add relevant files, links, constraints, and known facts.

