name: Research agent task
description: Assign investigation, architecture, or evidence gathering to a local Codex agent.
title: "[Research] "
labels:
  - "agent:ready"
  - "agent:researcher"
body:
  - type: textarea
    id: question
    attributes:
      label: Research question
      description: State the decision or uncertainty the agent must resolve.
    validations:
      required: true
  - type: textarea
    id: deliverable
    attributes:
      label: Required deliverable
      description: Describe the expected artifact, recommendation, or evidence standard.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Sources and context
      description: Add relevant files, links, constraints, and known facts.

