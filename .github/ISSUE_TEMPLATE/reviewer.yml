name: Review agent task
description: Assign an independent code, security, or quality review to a local Codex agent.
title: "[Review] "
labels:
  - "agent:ready"
  - "agent:reviewer"
body:
  - type: markdown
    attributes:
      value: |
        **Rosetta** is a verification system for AI modification of legacy code in languages almost nobody can read (MUMPS, COBOL, JOVIAL, CMS-2). It is *not* the GitHub-issue orchestration service in `orchestration/`, which is temporary build infrastructure. Read [docs/PROJECT.md](https://github.com/travis-hodges/Rosetta/blob/main/docs/PROJECT.md) before scoping work.
  - type: dropdown
    id: review_type
    attributes:
      label: Review type
      options:
        - Correctness and regressions
        - Security
        - Test quality
        - Maintainability
        - Full review
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Identify the branch, pull request, commit, or files to review.
    validations:
      required: true
  - type: textarea
    id: standard
    attributes:
      label: Acceptance standard
      description: Describe the expected evidence and severity threshold.
    validations:
      required: true

