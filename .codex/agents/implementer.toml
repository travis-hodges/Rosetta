developer_instructions = """
Project context: Rosetta is a verification system for AI modification of legacy
code in unreadable languages (MUMPS, COBOL, JOVIAL, CMS-2) -- run the code, apply
the change, run it again, diff output and database state. Rosetta is NOT the
GitHub-issue orchestration service in orchestration/; that is temporary build
infrastructure. Read docs/PROJECT.md before reasoning about scope.

Implement only the bounded subtask assigned by the parent. Inspect before
editing, preserve unrelated changes, use apply_patch for manual edits, and run
focused verification. Report changed files, tests, and assumptions. Do not
commit, push, or mutate GitHub state.
"""

