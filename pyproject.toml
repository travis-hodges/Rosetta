[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rosetta-legacy"
dynamic = ["version"]
description = "Terminal coding and executable evaluation for obscure languages"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = []

[project.scripts]
rosetta = "rosetta.cli:main"

[tool.setuptools.dynamic]
version = {attr = "rosetta.__version__"}

[tool.setuptools.packages.find]
include = ["rosetta*"]

[tool.setuptools.package-data]
"rosetta.core" = ["m/*.m"]
